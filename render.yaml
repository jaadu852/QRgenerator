services:
  - type: web
    name: cloudkrafts-qr-manager
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: CK_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://qr.cloudkrafts.in
